[build]
  # (scripts/content-nov14.mjs ran here once, Nov 14–15, and is done: content is edited in the admin since)
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The official domain (Nov 14, 2026): canonical URLs, sitemap, Open Graph and llms.txt point at it, and Google may
# index the site. Production only — deploy previews stay «noindex» (src/lib/seo.ts).
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://clearupagency.com"
  # NEXT_PUBLIC_: baked into the build — Netlify gives netlify.toml values to the build only, not to the server later
  NEXT_PUBLIC_SEO_INDEXABLE = "true"
  # Google Search Console ownership (URL-prefix property https://clearupagency.com/, HTML tag) — a public code, not a secret
  NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION = "X_iY82nerUtIm-kGb8eQjXVr7GtSqG4pShzBoxVfZe0"
  # Google Analytics 4 (Clear Up Website stream) — a public ID, not a secret
  NEXT_PUBLIC_GA_ID = "G-HWVCJ0TNE8"

# The Netlify address sends visitors (and search engines) to the official domain
[[redirects]]
  from = "https://wepclearup.netlify.app/*"
  to = "https://clearupagency.com/:splat"
  status = 301
  force = true

# Nov 15, 2026: the home address goes straight to the Arabic site from the server. Without it Netlify served
# public/index.html first (the static build's plain «English · العربية» page, kept for that build) and the
# visitor saw it flash, unstyled, before its refresh moved on to /ar/.
[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  force = true

# Nov 15, 2026: the old ClearUp site's pages (Google still lists them) → the new Arabic pages, applied by Netlify itself
# before the request reaches the site (the same list is in next.config.mjs for other hosts). Netlify matches the path
# with or without a trailing slash.
[[redirects]]
  from = "/about"
  to = "/ar/about/"
  status = 301
  force = true
